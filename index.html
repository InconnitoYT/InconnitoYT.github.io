<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inconnito Solutions – Accès sécurisé</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
    }
    header {
      padding: 20px;
      background: #050816;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .container {
      padding: 60px 20px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #c3c7e6;
      margin-bottom: 30px;
    }
    button {
      padding: 12px 26px;
      border: none;
      border-radius: 30px;
      background: #5865f2;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #4752d9;
      transform: translateY(-2px);
    }

    #videoOverlay {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>INCONNITO SOLUTIONS – ACCÈS SÉCURISÉ</header>

<div class="container">
  <h1>Portail de consultation des documents confidentiels</h1>
  <p>Veuillez confirmer votre identité pour accéder au document interne.</p>
  <button id="accessBtn">Accéder au document ➜</button>
</div>

<div id="videoOverlay">
  <video id="rickvid" playsinline>
    <source src="rick.mp4" type="video/mp4">
  </video>
</div>

<script>
  const overlay = document.getElementById("videoOverlay");
  const video = document.getElementById("rickvid");

  document.getElementById("accessBtn").addEventListener("click", () => {
    overlay.style.display = "flex";
    video.play(); // démarre la vidéo (sans son)
  });

  // Un clic sur la vidéo active le son
  video.addEventListener("click", () => {
    video.muted = false;
    video.play();
  });
</script>

</body>
</html>
